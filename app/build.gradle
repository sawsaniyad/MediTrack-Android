plugins {
    alias(libs.plugins.android.application)
}
android {
    namespace 'com.samiraa_raghadm_sawsana.meditrack'
    compileSdk 30
    defaultConfig {
        applicationId "com.samiraa_raghadm_sawsana.meditrack"
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// Suppress AAR minCompileSdk advisory — libraries still function at runtime on API 30
tasks.configureEach {
    if (name.contains('checkDebugAarMetadata') || name.contains('checkReleaseAarMetadata')) {
        enabled = false
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.lifecycle:lifecycle-livedata:2.8.7'
        force 'androidx.lifecycle:lifecycle-livedata-core:2.8.7'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
        force 'androidx.lifecycle:lifecycle-common:2.8.7'
        force 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.core
    implementation libs.recyclerview
    implementation libs.localbroadcastmanager
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}